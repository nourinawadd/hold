# Render blueprint. Commit this, then in Render: New → Blueprint → pick this repo.
#
# Steps, in order:
#
#   1. Create the database first, at neon.com. A free project gives you a connection string
#      shaped like:
#        postgresql://user:pass@ep-something-12345678.us-east-2.aws.neon.tech/neondb?sslmode=require
#      Copy it. Render's own free Postgres expires after 30 days, which is why the database
#      lives at Neon and only the app lives here.
#
#   2. New → Blueprint, choose this repo. Render reads this file and builds from the Dockerfile.
#
#   3. It will ask for the two values marked `sync: false` below, because they are secrets and
#      are deliberately not in this file:
#        DATABASE_URL       the string from step 1
#        ANTHROPIC_API_KEY  optional — without it the scraper simply skips its last-resort
#                           strategy and everything else still works
#
#   4. First boot applies the migration to the empty database. Watch the log for
#      "Applying migration '20260730005920_InitialCreate'", then open /health — it opens the
#      database rather than merely answering, so "ok" means the two halves really are talking.
#
# Worth knowing about the free tier: the app sleeps after 15 minutes of no traffic and takes
# roughly a minute to wake. Because this is Blazor Server, a sleeping app also drops any open
# circuit, so a tab left open overnight needs a refresh. Neon sleeps too, which the retry policy
# in Program.cs is there to absorb.

services:
  - type: web
    name: hold
    runtime: docker
    plan: free
    region: oregon
    branch: main

    # Opens the database, so a passing check means more than "the process started".
    healthCheckPath: /health

    envVars:
      # Entered in the dashboard, never committed.
      - key: DATABASE_URL
        sync: false

      - key: ANTHROPIC_API_KEY
        sync: false

      # Migrations run at startup either way; this is what stops DevDataSeeder inventing lists.
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

      # Render routes to whatever PORT says, and the Dockerfile listens on 8080. Both are stated
      # so they cannot drift apart — a mismatch here shows up as a health check that times out
      # while the app itself is perfectly happy.
      - key: PORT
        value: 8080

      - key: ASPNETCORE_HTTP_PORTS
        value: 8080

      - key: Logging__LogLevel__Default
        value: Information

      - key: Logging__LogLevel__Microsoft.AspNetCore
        value: Warning
