services:
  hold:
    build: .
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      DATABASE_URL: "postgresql://hold:hold@postgres:5432/hold"

      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_HTTP_PORTS: "8080"

      Logging__LogLevel__Default: "Information"
      Logging__LogLevel__Microsoft.AspNetCore: "Warning"

      Anthropic__ApiKey: "${ANTHROPIC_API_KEY:-}"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  postgres:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_DB: hold
      POSTGRES_USER: hold
      POSTGRES_PASSWORD: hold

    ports:
      - "5432:5432"

    volumes:
      - hold-postgres:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hold -d hold"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 10

volumes:
  hold-postgres:
